  { kind = "file", name = "contact.md", url = "/contact", depth = 0 },
  { kind = "symlink", name = "music", url = "https://sub0.productions", target = "sub0.productions", depth = 0 },
  { kind = "file", name = "resume.md", url = "/resume", depth = 0 },
]
